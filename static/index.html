<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageIndex | Ingestion Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.1);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient background blur */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: -10%;
      width: 50%; height: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(120px);
      z-index: -1;
      opacity: 0.4;
    }

    header {
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 17, 21, 0.7);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    main {
      padding: 48px;
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 32px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }

    h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #fff; }

    /* Controls */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px var(--accent-glow);
    }

    .btn:disabled {
      background: var(--surface);
      color: var(--text-muted);
      cursor: not-allowed;
      border: 1px solid var(--border);
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .btn.loading .spinner { display: block; }

    /* Drag & Drop */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(0,0,0,0.2);
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
    }
    .dropzone p { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; }

    .mode-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .mode-option {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.2); cursor: pointer;
    }
    .mode-option:hover { border-color: var(--accent); }
    .mode-option input { margin-top: 3px; }
    .mode-option strong { color: #fff; display: block; font-size: 0.9rem; }
    .mode-option span { color: var(--text-muted); font-size: 0.8rem; line-height: 1.35; }

    .vector-config {
      margin-bottom: 16px; padding: 12px; border-radius: 10px;
      border: 1px solid rgba(59,130,246,0.25); background: rgba(59,130,246,0.06);
    }
    .vector-config.hidden { display: none; }
    .vector-config label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .vector-config .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .vector-config input[type="number"] {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.35); color: #fff; font-family: inherit;
    }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: #fff; font-size: 0.85rem; }
    .badge.skipped { background: rgba(148,163,184,0.2); color: #cbd5e1; }

    /* Queue Grid */
    .queue-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .queue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .job-card {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .job-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      background: var(--surface-hover);
    }

    .job-id { font-family: monospace; font-size: 0.85rem; color: var(--text-muted); }
    .job-date { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    
    .badge {
      position: absolute;
      top: 16px; right: 16px;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge.pending { background: rgba(255,255,255,0.1); color: var(--text); }
    .badge.processing { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .badge.completed { background: rgba(16,185,129,0.2); color: #34d399; }
    .badge.failed { background: rgba(239,68,68,0.2); color: #f87171; }

    .error-msg {
      margin-top: 12px; font-size: 0.8rem; color: #f87171;
      background: rgba(239,68,68,0.1); padding: 8px; border-radius: 6px;
    }

    /* Modal / Tree Viewer */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      display: flex; justify-content: flex-end; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    
    .modal-panel {
      width: 600px; max-width: 90vw;
      background: var(--bg); border-left: 1px solid var(--border);
      height: 100%; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 32px;
    }
    .modal-overlay.active .modal-panel { transform: translateX(0); }

    .modal-close {
      position: absolute; top: 24px; right: 24px;
      background: none; border: none; color: var(--text-muted); font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-close:hover { color: #fff; }

    .tree ul { list-style: none; padding-left: 20px; border-left: 1px solid var(--border); margin-left: 8px;}
    .tree > ul { padding-left: 0; border-left: none; margin-left: 0; }
    .tree li { margin: 12px 0; position: relative; }
    .tree li::before {
      content: ''; position: absolute; left: -20px; top: 10px; width: 16px; height: 1px; background: var(--border);
    }
    .tree > ul > li::before { display: none; }

    .node-title { font-weight: 600; color: #fff; }
    .node-meta { font-size: 0.8rem; color: var(--accent); margin-left: 8px; }
    .node-ready { font-size: 0.7rem; background: rgba(16,185,129,0.2); color: #34d399; padding: 2px 6px; border-radius: 4px; margin-left: 8px;}
    .node-summary { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Page<span>Index</span></h1>
    <div class="nav-links">
      <a href="/usage">Credit Dashboard →</a>
    </div>
  </header>

  <main>
    <!-- Left Sidebar: Controls -->
    <aside>
      <div class="panel">
        <h2>PDF Upload</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5;">
          Choose a processing mode, then drag & drop a PDF.
        </p>

        <div class="mode-group" id="modeGroup">
          <label class="mode-option">
            <input type="radio" name="processMode" value="pageindex">
            <div>
              <strong>PageIndex</strong>
              <span>Tree indexing via PageIndex API only. Skips embeddings.</span>
            </div>
          </label>
          <label class="mode-option">
            <input type="radio" name="processMode" value="vector">
            <div>
              <strong>Vector</strong>
              <span>Local chunking + embeddings only. Skips PageIndex.</span>
            </div>
          </label>
          <label class="mode-option">
            <input type="radio" name="processMode" value="hybrid" checked>
            <div>
              <strong>Hybrid</strong>
              <span>Runs PageIndex and Vector in parallel.</span>
            </div>
          </label>
        </div>

        <div class="vector-config" id="vectorConfig">
          <strong style="color:#fff; font-size:0.9rem;">Document type (Vector)</strong>
          <div class="mode-group" style="margin-bottom: 12px;">
            <label class="mode-option">
              <input type="radio" name="docType" value="book" checked>
              <div>
                <strong>Book</strong>
                <span>Existing chunking + embedding (unchanged).</span>
              </div>
            </label>
            <label class="mode-option">
              <input type="radio" name="docType" value="notice_reply">
              <div>
                <strong>Notice / Reply</strong>
                <span>GST notice + reply pair. Embeds notice only.</span>
              </div>
            </label>
            <label class="mode-option">
              <input type="radio" name="docType" value="faq">
              <div>
                <strong>FAQ</strong>
                <span>Q/A pairs. Embeds questions only.</span>
              </div>
            </label>
          </div>

          <div id="bookChunkSettings">
            <strong style="color:#fff; font-size:0.9rem;">Book chunk settings</strong>
            <label class="check-row">
              <input type="checkbox" id="noChunking">
              No chunking (embed full document as one vector)
            </label>
            <div class="row" id="chunkInputs">
              <div>
                <label for="chunkSize">Chunk size (chars)</label>
                <input type="number" id="chunkSize" min="100" step="50" value="1000">
              </div>
              <div>
                <label for="chunkOverlap">Overlap (chars)</label>
                <input type="number" id="chunkOverlap" min="0" step="50" value="200">
              </div>
            </div>
          </div>
        </div>

        <div class="dropzone" id="dropzone">
          <strong style="color: #fff;">Drag & drop PDF</strong>
          <p>or click to browse</p>
          <input type="file" id="fileInput" accept=".pdf" hidden>
        </div>
        <p id="uploadStatus" style="font-size: 0.85rem; margin-top: 12px; color: var(--accent); text-align: center;"></p>
      </div>
    </aside>

    <!-- Right Content: Live Queue -->
    <section>
      <div class="panel" style="min-height: 80vh;">
        <div class="queue-header">
          <h2>Live Ingestion Queue</h2>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Auto-updating...</span>
        </div>
        <div class="queue-grid" id="queueGrid">
          <!-- Cards injected here -->
        </div>
      </div>
    </section>
  </main>

  <!-- Modal for Tree View -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-panel">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 id="modalTitle" style="margin-bottom: 8px;">Document Structure</h2>
      <p id="modalDocId" style="font-family: monospace; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 32px;"></p>
      <div id="treeView" class="tree"></div>
    </div>
  </div>

  <script>
    // Elements
    const queueGrid = document.getElementById('queueGrid');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const uploadStatus = document.getElementById('uploadStatus');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const treeView = document.getElementById('treeView');
    const modalTitle = document.getElementById('modalTitle');
    const modalDocId = document.getElementById('modalDocId');
    const vectorConfig = document.getElementById('vectorConfig');
    const noChunking = document.getElementById('noChunking');
    const chunkInputs = document.getElementById('chunkInputs');
    const chunkSize = document.getElementById('chunkSize');
    const chunkOverlap = document.getElementById('chunkOverlap');
    const bookChunkSettings = document.getElementById('bookChunkSettings');

    function selectedMode() {
      const el = document.querySelector('input[name="processMode"]:checked');
      return el ? el.value : 'hybrid';
    }

    function selectedDocType() {
      const el = document.querySelector('input[name="docType"]:checked');
      return el ? el.value : 'book';
    }

    function syncModeUI() {
      const mode = selectedMode();
      const showVector = mode === 'vector' || mode === 'hybrid';
      vectorConfig.classList.toggle('hidden', !showVector);
      const isBook = selectedDocType() === 'book';
      bookChunkSettings.classList.toggle('hidden', !isBook);
      chunkInputs.style.opacity = noChunking.checked ? '0.45' : '1';
      chunkSize.disabled = noChunking.checked;
      chunkOverlap.disabled = noChunking.checked;
    }

    document.querySelectorAll('input[name="processMode"]').forEach((el) => {
      el.addEventListener('change', syncModeUI);
    });
    document.querySelectorAll('input[name="docType"]').forEach((el) => {
      el.addEventListener('change', syncModeUI);
    });
    noChunking.addEventListener('change', syncModeUI);
    syncModeUI();

    // Poll Jobs
    async function fetchJobs() {
      try {
        const res = await fetch('/api/ingestion/jobs');
        if (!res.ok) return;
        const data = await res.json();
        renderQueue(data.jobs || []);
      } catch (e) {
        console.error(e);
      }
    }

    function renderQueue(jobs) {
      if (!jobs.length) {
        queueGrid.innerHTML = '<p style="color:var(--text-muted)">No jobs found in the database.</p>';
        return;
      }
      queueGrid.innerHTML = jobs.map(job => `
        <div class="job-card" onclick="openTree('${job.doc_id}', '${job.status}')">
          <div class="badge ${job.status}">${job.status}</div>
          <div style="font-weight: 600; color: #fff; margin-bottom: 4px;">
            ${job.seq_id != null ? `#${job.seq_id} ` : ''}${escapeHtml(job.file_name || 'Document')}
          </div>
          <div class="job-id">${job.doc_id}</div>
          <div class="job-date">${new Date(job.created_at).toLocaleString()}</div>
          ${renderServiceBox('PageIndex', job.pageindex || {}, '#34d399')}
          ${renderServiceBox('Vector', job.vector || job.embedding || {}, '#93c5fd')}
          ${job.error_message ? `<div class="error-msg">${escapeHtml(job.error_message)}</div>` : ''}
        </div>
      `).join('');
    }

    function renderServiceBox(label, progress, accent) {
      if (!progress || !progress.status) {
        return `
          <div style="margin-top: 10px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);">
            <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600;">${label} — idle</div>
          </div>
        `;
      }
      const status = escapeHtml(progress.status);
      const color = progress.status === 'skipped' ? '#cbd5e1' : accent;
      const message = progress.message
        ? `<div class="job-date" style="margin-top:6px;">${escapeHtml(progress.message)}</div>`
        : '';
      const count = (progress.total || progress.chunk_count)
        ? `<div class="job-date">${progress.done || progress.embedded_nodes || 0}/${progress.total || progress.chunk_count || progress.total_nodes || 0}</div>`
        : (progress.node_count != null ? `<div class="job-date">nodes: ${progress.node_count}</div>` : '');
      const model = progress.model_name
        ? `<div class="job-date">${escapeHtml(progress.model_name)}</div>`
        : '';
      return `
        <div style="margin-top: 10px; padding: 10px; border-radius: 8px; background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.16);">
          <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: ${color}; font-weight: 600;">${label} — ${status}</div>
          ${count}
          ${message}
          ${model}
        </div>
      `;
    }

    // Modal / Tree
    modalClose.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) modalOverlay.classList.remove('active'); });

    async function openTree(docId, status) {
      if (status !== 'completed') return;
      modalOverlay.classList.add('active');
      modalDocId.textContent = docId;
      treeView.innerHTML = '<div class="spinner" style="display:block; border-top-color:var(--accent); margin: 20px auto;"></div>';
      
      try {
        const res = await fetch(`/api/ingestion/jobs/${docId}/tree`);
        if (!res.ok) throw new Error('Failed to load tree');
        const data = await res.json();
        treeView.innerHTML = renderTreeHTML(data.structure);
      } catch (e) {
        treeView.innerHTML = `<p style="color:#f87171">${e.message}</p>`;
      }
    }

    function renderTreeHTML(nodes) {
      if (!nodes || !nodes.length) return "<p>No structure.</p>";
      let html = "<ul>";
      for (const node of nodes) {
        html += "<li>";
        html += `<div><span class="node-title">${escapeHtml(node.title || "Untitled")}</span>`;
        if (node.type) html += `<span class="node-meta">${escapeHtml(node.type)}</span>`;
        if (node.retrieval_ready) html += `<span class="node-ready">Ready</span>`;
        html += `</div>`;
        if (node.micro_summary) html += `<div class="node-summary">${escapeHtml(node.micro_summary)}</div>`;
        if (node.nodes && node.nodes.length) html += renderTreeHTML(node.nodes);
        html += "</li>";
      }
      html += "</ul>";
      return html;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Direct Upload Handler
    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault(); dropzone.classList.remove("dragover");
      handleUpload(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => handleUpload(fileInput.files[0]));

    async function handleUpload(file) {
      if (!file) return;
      const mode = selectedMode();
      const docType = selectedDocType();
      const skipChunk = noChunking.checked;
      const size = Number(chunkSize.value || 1000);
      const overlap = Number(chunkOverlap.value || 200);

      if ((mode === 'vector' || mode === 'hybrid') && docType === 'book' && !skipChunk) {
        if (size < 100) {
          uploadStatus.innerHTML = `<span style="color:var(--danger)">Chunk size must be >= 100</span>`;
          return;
        }
        if (overlap < 0 || overlap >= size) {
          uploadStatus.innerHTML = `<span style="color:var(--danger)">Overlap must be >= 0 and < chunk size</span>`;
          return;
        }
      }

      uploadStatus.textContent = `Uploading (${mode} / ${docType})...`;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("mode", mode);
      formData.append("doc_type", docType);
      formData.append("no_chunking", skipChunk ? "true" : "false");
      formData.append("chunk_size", String(size));
      formData.append("chunk_overlap", String(overlap));
      try {
        const res = await fetch("/api/process", { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `Upload failed (${res.status})`);
        uploadStatus.innerHTML = `<span style="color:var(--success)">Queued (${escapeHtml(data.mode || mode)} / ${escapeHtml(data.doc_type || docType)}). Doc ID: ${escapeHtml(data.doc_id || "")}</span>`;
        fetchJobs();
      } catch (err) {
        uploadStatus.innerHTML = `<span style="color:var(--danger)">${err.message}</span>`;
      }
      setTimeout(() => uploadStatus.textContent = "", 7000);
    }

    // Initial load and poll
    fetchJobs();
    setInterval(fetchJobs, 3000);

  </script>
</body>
</html>
